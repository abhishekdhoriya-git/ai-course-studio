name: Studio contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:ui
